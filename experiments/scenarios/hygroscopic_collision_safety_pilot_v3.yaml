metadata:
  name: Hygroscopic Collision Safety Pilot v3
  slug: hygroscopic_collision_safety_pilot_v3
  memo: >-
    Post-v2 real-PySDM safety gate for the collision-dominated response study.
    Sixteen collision-ON sentinel cases span updraft, background aerosol, and
    seed dry radius with three common ensemble seeds and paired
    control/seeding runs. Run this bounded 96-model pilot before any v3 atlas.
    It diagnoses the Rogers-Yau giant-drop domain and retained-parcel behavior;
    it is not a cloud-seeding efficacy experiment.
  created_at: '2026-07-28T00:00:00'
config:
  schema_version: 1
  experiment:
    name: hygroscopic_collision_safety_pilot_v3
    mode: parameter_sweep
    description: >-
      Collision-ON safety and domain-qualification pilot for the next
      hygroscopic response atlas.
    random_seed: 74001
  simulation:
    adapter: pysdm_parcel
    case_name: base
    notes: >-
      Engineering and physical-domain gate only. The current parcel adapter
      enables collision-coalescence but does not implement sedimentation,
      fallout, or breakup. Treat giant-drop growth and any Rogers-Yau
      interpolation boundary as model-domain evidence, not missing-at-random
      execution noise.
  environment:
    temperature: 300.0
    pressure: 100000.0
    water_vapour_mixing_ratio: 0.024
    relative_humidity: 96.0
    initial_altitude: 0.0
    updraft_velocity: 0.6
    duration: 1500
    timestep: 5
  background_aerosol:
    distribution_type: single_lognormal
    number_concentration: 40.0
    number_superdroplets: 800
    dry_radius: 9.0e-08
    geometric_sigma: 1.5
    kappa: 0.7
    particle_density: 2160.0
    chemical_composition: sea_salt_mixed
  seeding:
    enabled: true
    material_type: hygroscopic
    dry_radius: 7.0e-07
    geometric_sigma: 1.2
    kappa: 0.8
    particle_density: 1770.0
    number_concentration: 10.0
    number_superdroplets: 800
    injection_start: 300
    injection_end: 420
    injection_altitude: 500.0
    delivery_method: idealized_uniform
  dynamics:
    updraft_strength: 0.6
    downdraft_strength: 0.0
    turbulence_intensity: 0.1
    entrainment_rate: 0.0
    detrainment_rate: 0.0
    wind_shear: 0.0
    convergence: 0.0
    cape: 0.0
    cin: 0.0
  microphysics:
    condensation: true
    collision: true
    sedimentation: false
  diagnostics:
    growth_pathway_mode: true
    activation_radius_threshold: 5.0e-07
    rain_radius_threshold: 2.5e-05
    wet_radius_spectrum:
      enabled: true
      min_radius: 5.0e-08
      max_radius: 0.006
      n_bins: 72
      checkpoint_times:
      - 0.0
      - 60.0
      - 180.0
      - 300.0
      - 420.0
      - 600.0
      - 900.0
      - 1200.0
      - 1500.0
      checkpoint_interval_seconds: 5.0
      threshold_factors:
      - 0.8
      - 1.0
      - 1.2
    water_budget:
      enabled: true
      warning_relative_drift_percent: 0.01
      failure_relative_drift_percent: 0.1
    numerical_convergence:
      enabled: false
      relative_tolerance_percent: 5.0
      relative_reference_floor: 1.0e-12
      metrics: []
    spectrum_transition:
      enabled: true
      rain_volume_fraction_threshold: 0.01
      rain_volume_fraction_thresholds:
      - 0.005
      - 0.01
      - 0.02
  sweep:
    design: cartesian
    run_mode: control_vs_seeding
    max_runs: 16
    ranking_metric: ensemble.metrics.rain_water_mixing_ratio_diff_integral_mean
    parameters:
    - name: environment.updraft_velocity
      values:
      - 0.3
      - 0.6
      - 0.9
      - 1.2
    - name: background_aerosol.number_concentration
      values:
      - 40.0
      - 640.0
    - name: seeding.dry_radius
      values:
      - 7.0e-07
      - 1.7e-06
  ensemble:
    enabled: true
    n_members: 3
    seed_start: 74001
    seed_step: 1009
    execution_backend: in_process
    collect_garbage_between_members: false
  execution:
    max_workers: 8
    planning_note: >-
      Submit only as the v3 safety gate. Inspect every failed or partial member
      for maximum-radius/Rogers-Yau evidence before authorizing a larger run.
  output:
    base_dir: results
    save_config: true
    save_summary: true
    save_timeseries: true
