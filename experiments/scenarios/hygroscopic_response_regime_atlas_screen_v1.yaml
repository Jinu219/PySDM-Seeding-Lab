metadata:
  name: Hygroscopic Response Regime Atlas Screen v1
  slug: hygroscopic_response_regime_atlas_screen_v1
  memo: >-
    Large real-PySDM screening atlas for locating competition-dominated,
    sign-reversing, and persistent-enhancement hygroscopic-seeding regimes.
    It varies updraft, background aerosol loading, seed dose, injection stage,
    and collision-coalescence while holding seed size and kappa fixed. Three
    common seeds support boundary discovery only; selected boundary cases must
    be confirmed later with a larger ensemble and numerical qualification.
  created_at: '2026-07-27T00:00:00'
config:
  schema_version: 1
  experiment:
    name: hygroscopic_response_regime_atlas_screen_v1
    mode: parameter_sweep
    description: >-
      Five-dimensional mechanism screen for determining when hygroscopic
      seeding changes from transient or persistent rain-water suppression to
      collision-assisted enhancement.
    random_seed: 63001
  simulation:
    adapter: pysdm_parcel
    case_name: base
    notes: >-
      Regime-boundary screening, not optimization or efficacy evidence. Seed
      dry radius and kappa are fixed to avoid repeating the previous
      activation-strength response surfaces. Absolute injection times sample
      early, developing, and mature parcel states; control state at injection
      must be inspected before assigning a lifecycle label.
  environment:
    temperature: 300.0
    pressure: 100000.0
    water_vapour_mixing_ratio: 0.024
    relative_humidity: 96.0
    initial_altitude: 0.0
    updraft_velocity: 0.8
    duration: 1500
    timestep: 10
  background_aerosol:
    distribution_type: single_lognormal
    number_concentration: 160.0
    number_superdroplets: 400
    dry_radius: 9.0e-08
    geometric_sigma: 1.5
    kappa: 0.7
    particle_density: 2160.0
    chemical_composition: sea_salt_mixed
  seeding:
    enabled: true
    material_type: hygroscopic
    dry_radius: 1.0e-06
    geometric_sigma: 1.2
    kappa: 0.8
    particle_density: 1770.0
    number_concentration: 10.0
    number_superdroplets: 400
    injection_start: 300
    injection_end: 420
    injection_altitude: 500.0
    delivery_method: idealized_uniform
  dynamics:
    updraft_strength: 0.8
    downdraft_strength: 0.0
    turbulence_intensity: 0.1
    entrainment_rate: 0.0
    detrainment_rate: 0.0
    wind_shear: 0.0
    convergence: 0.0
    cape: 0.0
    cin: 0.0
  microphysics:
    condensation: true
    collision: true
    sedimentation: false
  diagnostics:
    growth_pathway_mode: true
    activation_radius_threshold: 5.0e-07
    rain_radius_threshold: 2.5e-05
    wet_radius_spectrum:
      enabled: true
      min_radius: 5.0e-08
      max_radius: 0.001
      n_bins: 32
      checkpoint_times:
      - 0.0
      - 60.0
      - 180.0
      - 300.0
      - 420.0
      - 600.0
      - 900.0
      - 1020.0
      - 1200.0
      - 1500.0
      checkpoint_interval_seconds: 10.0
      threshold_factors:
      - 0.8
      - 1.0
      - 1.2
    water_budget:
      enabled: true
      warning_relative_drift_percent: 0.01
      failure_relative_drift_percent: 0.1
    numerical_convergence:
      enabled: false
      relative_tolerance_percent: 5.0
      relative_reference_floor: 1.0e-12
      metrics: []
    spectrum_transition:
      enabled: true
      rain_volume_fraction_threshold: 0.01
      rain_volume_fraction_thresholds:
      - 0.005
      - 0.01
      - 0.02
  sweep:
    design: cartesian
    run_mode: control_vs_seeding
    max_runs: 162
    ranking_metric: ensemble.metrics.rain_water_mixing_ratio_diff_integral_mean
    parameters:
    - name: environment.updraft_velocity
      values:
      - 0.4
      - 0.8
      - 1.2
    - name: background_aerosol.number_concentration
      values:
      - 40.0
      - 160.0
      - 640.0
    - name: seeding.number_concentration
      values:
      - 2.5
      - 10.0
      - 40.0
    - name: seeding.injection_start
      values:
      - 60
      - 300
      - 900
    - name: seeding.injection_duration
      values:
      - 120
    - name: microphysics.collision
      values:
      - false
      - true
  ensemble:
    enabled: true
    n_members: 3
    seed_start: 63001
    seed_step: 1009
    execution_backend: in_process
    collect_garbage_between_members: false
  execution:
    max_workers: 12
  output:
    base_dir: results
    save_config: true
    save_summary: true
    save_timeseries: true
