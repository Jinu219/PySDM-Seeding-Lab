metadata:
  name: Hygroscopic Response Regime Atlas Refinement v2
  slug: hygroscopic_response_regime_atlas_refinement_v2
  memo: >-
    Overnight real-PySDM refinement of the v1 regime screen. A deterministic
    512-point Latin Hypercube samples eight physical and intervention axes,
    with ten common ensemble seeds and paired control/seeding runs. The design
    is intended to refine response boundaries and interactions, not to claim
    field-scale cloud-seeding efficacy.
  created_at: '2026-07-27T00:00:00'
config:
  schema_version: 1
  experiment:
    name: hygroscopic_response_regime_atlas_refinement_v2
    mode: parameter_sweep
    description: >-
      High-resolution multidimensional refinement of competition-dominated,
      sign-reversing, and collision-assisted hygroscopic-seeding responses.
    random_seed: 64001
  simulation:
    adapter: pysdm_parcel
    case_name: base
    notes: >-
      Latin Hypercube refinement with paired common seeds. Interpret outcomes
      as idealized parcel-model response surfaces and boundary hypotheses.
  environment:
    temperature: 300.0
    pressure: 100000.0
    water_vapour_mixing_ratio: 0.024
    relative_humidity: 96.0
    initial_altitude: 0.0
    updraft_velocity: 0.8
    duration: 2400
    timestep: 5
  background_aerosol:
    distribution_type: single_lognormal
    number_concentration: 160.0
    number_superdroplets: 800
    dry_radius: 9.0e-08
    geometric_sigma: 1.5
    kappa: 0.7
    particle_density: 2160.0
    chemical_composition: sea_salt_mixed
  seeding:
    enabled: true
    material_type: hygroscopic
    dry_radius: 1.0e-06
    geometric_sigma: 1.2
    kappa: 0.8
    particle_density: 1770.0
    number_concentration: 10.0
    number_superdroplets: 800
    injection_start: 300
    injection_end: 420
    injection_altitude: 500.0
    delivery_method: idealized_uniform
  dynamics:
    updraft_strength: 0.8
    downdraft_strength: 0.0
    turbulence_intensity: 0.1
    entrainment_rate: 0.0
    detrainment_rate: 0.0
    wind_shear: 0.0
    convergence: 0.0
    cape: 0.0
    cin: 0.0
  microphysics:
    condensation: true
    collision: true
    sedimentation: false
  diagnostics:
    growth_pathway_mode: true
    activation_radius_threshold: 5.0e-07
    rain_radius_threshold: 2.5e-05
    wet_radius_spectrum:
      enabled: true
      min_radius: 5.0e-08
      max_radius: 0.001
      n_bins: 48
      checkpoint_times:
      - 0.0
      - 60.0
      - 180.0
      - 300.0
      - 600.0
      - 900.0
      - 1200.0
      - 1500.0
      - 1800.0
      - 2100.0
      - 2400.0
      checkpoint_interval_seconds: 10.0
      threshold_factors:
      - 0.8
      - 1.0
      - 1.2
    water_budget:
      enabled: true
      warning_relative_drift_percent: 0.01
      failure_relative_drift_percent: 0.1
    numerical_convergence:
      enabled: false
      relative_tolerance_percent: 5.0
      relative_reference_floor: 1.0e-12
      metrics: []
    spectrum_transition:
      enabled: true
      rain_volume_fraction_threshold: 0.01
      rain_volume_fraction_thresholds:
      - 0.005
      - 0.01
      - 0.02
  sweep:
    design: latin_hypercube
    n_samples: 512
    random_seed: 64001
    run_mode: control_vs_seeding
    max_runs: 512
    ranking_metric: ensemble.metrics.rain_water_mixing_ratio_diff_integral_mean
    parameters:
    - name: environment.updraft_velocity
      min: 0.25
      max: 1.4
      scale: linear
      round_digits: 6
    - name: background_aerosol.number_concentration
      min: 20.0
      max: 1280.0
      scale: log
      round_digits: 6
    - name: seeding.number_concentration
      min: 1.0
      max: 100.0
      scale: log
      round_digits: 6
    - name: seeding.injection_start
      min: 60
      max: 1200
      scale: linear
      value_type: int
    - name: seeding.injection_duration
      min: 60
      max: 300
      scale: linear
      value_type: int
    - name: seeding.dry_radius
      min: 5.0e-07
      max: 2.0e-06
      scale: log
      round_digits: 12
    - name: seeding.kappa
      min: 0.4
      max: 1.2
      scale: linear
      round_digits: 6
    - name: microphysics.collision
      values:
      - false
      - true
  ensemble:
    enabled: true
    n_members: 10
    seed_start: 64001
    seed_step: 1009
    execution_backend: in_process
    collect_garbage_between_members: false
  execution:
    max_workers: 12
    planning_wall_time_hours:
    - 12
    - 24
    planning_note: >-
      Engineering estimate from the v1 server throughput scaled for 3.2x more
      timesteps and 2x the super-droplet representation. Use the live Server
      Jobs ETA after initial cases finish.
  output:
    base_dir: results
    save_config: true
    save_summary: true
    save_timeseries: true
